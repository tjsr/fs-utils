name: Legacy release workflow retired
# Releases use the bounded, verified publish job in build.yml instead.
# Keep the old dispatch entry harmless so it cannot force-update existing tags.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The force-tagging release path has been retired."
          echo "Use a reviewed version change and an explicitly authorized release workflow."
          exit 1
